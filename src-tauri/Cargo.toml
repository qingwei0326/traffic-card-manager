[package]
name = "traffic-card-manager"
version = "1.0.1"
description = "流量卡管理系统 - 本地版"
edition = "2021"

[lib]
name = "traffic_card_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
md5 = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
# 备份文件完整性校验；sha2 已在依赖树里（其他 crate 间接引入），不会新增下载
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-ico", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
# 关掉默认特性：默认的 sync-secret-service 会拉进 secret-service → libdbus-sys，
# 而后者靠 pkg-config 找 libdbus-1-dev，CI 的 ubuntu runner 上没有，会直接编译失败。
# 只启用两端原生后端：Windows 凭据管理器 / Linux keyutils（纯 Rust，无 C 依赖）。
keyring = { version = "3", default-features = false, features = ["windows-native", "linux-native"] }

[dev-dependencies]
tempfile = "3"
