name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build and publish installer
        run: npm run build -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload portable zip
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $portable = Get-ChildItem -LiteralPath release -Filter '*-portable.zip' | Select-Object -First 1
          if ($null -eq $portable) {
            throw 'Portable zip not found in release directory'
          }
          gh release upload $env:GITHUB_REF_NAME $portable.FullName --clobber --repo $env:GITHUB_REPOSITORY

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            release/*.exe
            release/*.exe.blockmap
            release/*-portable.zip
            release/latest.yml
          if-no-files-found: error
