name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build Windows Release
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # 测试与类型检查由 .github/workflows/ci.yml 在 PR / push 阶段完成，
      # tag 必然来自已通过 CI 的 commit，此处不再重复执行以缩短发版时间。
      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run build

      - name: Generate updater manifest
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          $tagVersion = $tag -replace '^v', ''
          $packageVersion = (Get-Content -Raw -LiteralPath package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion must match package.json version $packageVersion"
          }

          $bundleDir = 'src-tauri/target/release/bundle/nsis'
          $installer = Get-ChildItem -LiteralPath $bundleDir -Filter '*_x64-setup.exe' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $installer) {
            throw "Windows installer not found in $bundleDir"
          }

          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path -LiteralPath $signaturePath)) {
            throw "Updater signature not found: $signaturePath"
          }

          $signature = (Get-Content -Raw -LiteralPath $signaturePath).Trim()
          $assetName = [System.Uri]::EscapeDataString($installer.Name)
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$assetName"

          $manifest = [ordered]@{
            version = $packageVersion
            notes = "Release $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = [ordered]@{
              'windows-x86_64' = [ordered]@{
                signature = $signature
                url = $downloadUrl
              }
            }
          }

          $manifestPath = Join-Path $bundleDir 'latest.json'
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $manifestPath -Encoding utf8
          Get-Content -LiteralPath $manifestPath

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-release
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          if-no-files-found: error
