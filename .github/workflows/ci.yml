name: CI

# 日常开发门禁：release.yml 只在 push tag 时触发，此 workflow 补齐 PR / main push 的检查。
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run typecheck
        run: npm run typecheck

      - name: Check frontend/backend contract consistency
        run: npm run contract:check

  rust:
    name: Rust tests
    # 只跑 Windows：tauri.conf.json 的 bundle targets 只有 NSIS，Linux 不产出任何制品。
    # 而 Tauri 在 Linux 上要编译 webkit2gtk / gtk / dbus 一整套系统库，需要预先 apt 装
    # 一堆 dev 包——为一份不会发布的产物维护一条易碎的依赖链，不划算。
    # 将来若真的要发 Linux 版本，把这里改回 matrix 并补上 tauri 官方的 apt 依赖清单即可。
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # xlsx 已换成 SheetJS 官方 CDN 构建（3ca15e5），高危告警清零，此处恢复为硬门禁。

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit high severity vulnerabilities
        run: npm audit --audit-level=high
